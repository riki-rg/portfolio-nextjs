# /etc/nginx/conf.d/portfolio-rizz.conf
# Reverse proxy untuk portfolio-rizz (Next.js di Docker)

server {
    listen 80;
    server_name portfolio.example.com;   # <-- GANTI dengan domain/IP kamu

    # Ukuran upload & timeout
    client_max_body_size 10M;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://portfolio-rizz:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache asset statis Next.js
    location /_next/static/ {
        proxy_pass http://portfolio-rizz:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }
}
